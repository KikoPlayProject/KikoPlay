name: Build and Package KikoPlay

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  QT_VERSION: "6.8.3"
  BUILD_TYPE: "Release"

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - artifact_name: kikoplay-amd64
            arch: amd64
            qt_arch: linux_gcc_64
          - artifact_name: kikoplay-arm64
            arch: arm64
            qt_arch: linux_gcc_arm64

    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libmpv-dev \
          ffmpeg \
          libprotobuf-dev \
          libxkbcommon-x11-dev \
          libxcb-cursor-dev \
          libminizip-dev \
          libevent-dev \
          liblua5.3-dev \
          libfuse2 \
          desktop-file-utils

    - name: Install ONNX Runtime
      run: |
        # Download and install ONNX Runtime from GitHub releases
        if [ "${{ matrix.arch }}" = "amd64" ]; then
          wget https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-linux-x64-1.22.0.tgz
          tar -xzf onnxruntime-linux-x64-1.22.0.tgz
          sudo cp -r onnxruntime-linux-x64-1.22.0/lib/* /usr/lib/
          sudo cp -r onnxruntime-linux-x64-1.22.0/include/* /usr/include/
        else
          wget https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-linux-aarch64-1.22.0.tgz
          tar -xzf onnxruntime-linux-aarch64-1.22.0.tgz
          sudo cp -r onnxruntime-linux-aarch64-1.22.0/lib/* /usr/lib/
          sudo cp -r onnxruntime-linux-aarch64-1.22.0/include/* /usr/include/
        fi

    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        arch: ${{ matrix.qt_arch }}
        target: 'desktop'
        modules: 'qtpositioning qtwebchannel qtwebengine qtwebsockets qtwaylandcompositor'

    - name: Create secrets header
      run: |
        cat > Common/secrets.h << 'EOF'
        #undef APP_ID_KIKO
        #undef APP_SECRET_KIKO
        #undef APP_ID_DANDAN
        #undef APP_SECRET_DANDAN
        
        #define APP_ID_KIKO "${{ secrets.APP_ID_KIKO }}"
        #define APP_SECRET_KIKO "${{ secrets.APP_SECRET_KIKO }}"
        #define APP_ID_DANDAN "${{ secrets.APP_ID_DANDAN }}"
        #define APP_SECRET_DANDAN "${{ secrets.APP_SECRET_DANDAN }}"
        EOF

    - name: Build main application
      run: |
        qmake6 build.pro
        make -j$(nproc)

    - name: Package .deb
      run: |
        make INSTALL_ROOT=$PWD/debian install

        # Get version from git tag or use default
        if [ -n "${{ github.ref_name }}" ] && echo "${{ github.ref_name }}" | grep -q '^[0-9]'; then
            VERSION="${{ github.ref_name }}"
        else
            VERSION="2.0.0"
        fi

        # Update version and architecture in control file
        sed -i "s/^Version:.*/Version: ${VERSION}/" debian/DEBIAN/control
        sed -i "s/^Architecture:.*/Architecture: ${{ matrix.arch }}/" debian/DEBIAN/control

        dpkg-deb --build --root-owner-group debian kikoplay-${{ matrix.arch }}.deb

    - name: Full Package
      run: |
        sed -i "s/^Depends:.*/Depends: /" debian/DEBIAN/control

        if [ "${{ matrix.arch }}" = "amd64" ]; then
          wget https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          mv linuxdeployqt-continuous-x86_64.AppImage linuxdeployqt.AppImage
          chmod a+x linuxdeployqt.AppImage
        else
          wget https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-aarch64.AppImage
          mv linuxdeployqt-continuous-aarch64.AppImage linuxdeployqt.AppImage
          chmod a+x linuxdeployqt.AppImage
        fi

        mkdir -p debian/usr/share/doc/libc6/
        touch debian/usr/share/doc/libc6/copyright

        ./linuxdeployqt.AppImage \
          debian/usr/share/applications/io.github.KikoPlayProject.KikoPlay.desktop \
          -appimage \
          -unsupported-allow-new-glibc \
          -exclude-libs=libqsqlmimer,libmysqlclient,libqsqlmysql,libqsqlpsql,libqsqlodbc,libqtposition_nmea

        if [ "${{ matrix.arch }}" = "amd64" ]; then
          mv KikoPlay-*x86_64.AppImage kikoplay-${{ matrix.arch }}-full.AppImage
        else
          mv KikoPlay-*aarch64.AppImage kikoplay-${{ matrix.arch }}-full.AppImage
        fi

        rm -r debian/usr/share/doc
        rm debian/{.DirIcon,AppRun,io.github.KikoPlayProject.KikoPlay.desktop,io.github.KikoPlayProject.KikoPlay.png}

        mkdir -p debian/opt/kikoplay
        mv debian/usr/{bin,lib,libexec,plugins,resources,translations} debian/opt/kikoplay
        desktop-file-edit \
          --set-key=Exec \
          --set-value=/opt/kikoplay/bin/KikoPlay \
          debian/usr/share/applications/io.github.KikoPlayProject.KikoPlay.desktop
        dpkg-deb --build --root-owner-group debian kikoplay-${{ matrix.arch }}-full.deb

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          kikoplay-${{ matrix.arch }}.deb
          kikoplay-${{ matrix.arch }}-full.deb
          kikoplay-${{ matrix.arch }}-full.AppImage

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          kikoplay-${{ matrix.arch }}.deb
          kikoplay-${{ matrix.arch }}-full.deb
          kikoplay-${{ matrix.arch }}-full.AppImage
        draft: false
        prerelease: false

  build-macos:
    runs-on: macos-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install system dependencies
      run: |
        brew update
        brew install mpv lua onnxruntime aria2 create-dmg

    - name: Build protobuf 3.21.8 (static lite) for KService
      run: |
        # The pre-generated Service/pb/service.pb.{cc,h} are produced by
        # protoc 3.21.8 and require a matching libprotobuf. Homebrew ships a
        # much newer, incompatible protobuf, so build 3.21.8 from source and
        # install it into a local prefix. A static libprotobuf-lite.a is used
        # so the resulting .app needs no extra dylib.
        PB_PREFIX="$HOME/protobuf-3.21.8"
        curl -L -o protobuf-cpp-3.21.8.tar.gz \
          https://github.com/protocolbuffers/protobuf/releases/download/v21.8/protobuf-cpp-3.21.8.tar.gz
        tar -xzf protobuf-cpp-3.21.8.tar.gz
        cd protobuf-3.21.8
        ./configure --prefix="$PB_PREFIX" --disable-shared --enable-static
        make -j$(sysctl -n hw.ncpu)
        make install
        echo "KIKO_PROTOBUF_PREFIX=$PB_PREFIX" >> "$GITHUB_ENV"

    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        arch: clang_64
        target: 'desktop'
        modules: 'qtpositioning qtwebchannel qtwebengine qtwebsockets'

    - name: Create secrets header
      run: |
        cat > Common/secrets.h << 'EOF'
        #undef APP_ID_KIKO
        #undef APP_SECRET_KIKO
        #undef APP_ID_DANDAN
        #undef APP_SECRET_DANDAN

        #define APP_ID_KIKO "${{ secrets.APP_ID_KIKO_MAC }}"
        #define APP_SECRET_KIKO "${{ secrets.APP_SECRET_KIKO_MAC }}"
        #define APP_ID_DANDAN "${{ secrets.APP_ID_DANDAN }}"
        #define APP_SECRET_DANDAN "${{ secrets.APP_SECRET_DANDAN }}"
        EOF

    - name: Generate app icon (icns)
      run: |
        ICONSET=kikoplay.iconset
        mkdir -p "$ICONSET"
        for size in 16 32 64 128 256 512; do
          sips -z $size $size kikoplay.png --out "$ICONSET/icon_${size}x${size}.png"
          double=$((size * 2))
          sips -z $double $double kikoplay.png --out "$ICONSET/icon_${size}x${size}@2x.png"
        done
        iconutil -c icns "$ICONSET" -o kikoplay.icns
        rm -rf "$ICONSET"

    - name: Build main application
      run: |
        qmake6 build.pro
        make -j$(sysctl -n hw.ncpu)

    - name: Bundle resources and dependencies
      run: |
        APP="KikoPlay.app"
        # Bundle Qt frameworks, plugins and third-party dylibs
        macdeployqt "$APP" -verbose=1

        # KikoPlay looks for the web assets next to the executable
        cp -R web "$APP/Contents/MacOS/web"

        # Ship aria2c so the download feature works out of the box
        cp "$(brew --prefix aria2)/bin/aria2c" "$APP/Contents/MacOS/aria2c"

        # macdeployqt rewrites library paths with install_name_tool, which
        # invalidates the existing code signatures. On Apple Silicon an
        # invalid signature makes the kernel SIGKILL the process
        # (CODESIGNING, Code 2 Invalid Page). Re-sign the whole bundle with an
        # ad-hoc signature after all modifications are done.
        codesign --force --deep --sign - --timestamp=none "$APP/Contents/MacOS/aria2c"
        codesign --force --deep --sign - --timestamp=none "$APP"
        codesign --verify --deep --verbose=2 "$APP"

    - name: Create DMG
      run: |
        # Get version from git tag or use default
        if [ -n "${{ github.ref_name }}" ] && echo "${{ github.ref_name }}" | grep -q '^[0-9]'; then
            VERSION="${{ github.ref_name }}"
        else
            VERSION="2.0.0"
        fi

        mkdir -p dmg-src
        cp -R KikoPlay.app dmg-src/

        create-dmg \
          --volname "KikoPlay ${VERSION}" \
          --icon "KikoPlay.app" 150 190 \
          --app-drop-link 450 190 \
          --window-size 600 400 \
          --no-internet-enable \
          "kikoplay-macos-arm64.dmg" \
          "dmg-src" || \
        create-dmg \
          --volname "KikoPlay ${VERSION}" \
          "kikoplay-macos-arm64.dmg" \
          "dmg-src"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kikoplay-macos-arm64
        path: |
          kikoplay-macos-arm64.dmg

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          kikoplay-macos-arm64.dmg
        draft: false
        prerelease: false